
services:
  backend:
    build: .
    container_name: fastmysite_security
    ports:
      - "8000:8000"
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: redis_cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 30s
      retries: 50

  celery_worker:
    build: .
    container_name: celery_worker
    command: ["celery", "-A", "celery_worker:celery_app", "worker", "--loglevel=info", "--pool=prefork", "--concurrency=6", "-Q", "scanning"]

    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app  # Ensures Python can find the modules
